global:
  resolve_timeout: 1m

route:
  group_by: ['alertname', 'service']
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1m
  receiver: 'copilot-webhook'

receivers:
  - name: 'copilot-webhook'
    webhook_configs:
      - url: 'http://copilot-backend:8000/api/v1/alerts/webhook'
        send_resolved: true
        max_alerts: 5
